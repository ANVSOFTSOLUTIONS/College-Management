---
# Runs on cPanel's server on every deploy. cPanel checks out the `deploy`
# branch, which .github/workflows/deploy-cpanel.yml builds on every push to
# main: it already contains the built frontend in frontend/dist, so nothing
# is compiled here (shared hosting's memory limit kills `npm run build`).
#
# Frontend: college.anvsoftsolutions.com  API: collegeapi.anvsoftsolutions.com.
# These are paths, not secrets — secrets live in the Python App's environment
# variables on cPanel, never in this file.
deployment:
  tasks:
    - export FRONTEND_PATH=/home/goldenle/college.anvsoftsolutions.com
    - export BACKEND_PATH=/home/goldenle/college_backend
    - export BACKEND_VENV=/home/goldenle/virtualenv/college_backend/3.11/bin
    - /bin/bash -c "test -f frontend/dist/index.html || (echo 'frontend/dist missing - deploy the deploy branch, not main' && exit 1)"
    - /bin/bash -c "mkdir -p $FRONTEND_PATH && rsync -a --delete --exclude=.well-known --exclude=cgi-bin frontend/dist/ $FRONTEND_PATH/"
    - /bin/bash -c "mkdir -p $BACKEND_PATH && rsync -a --delete --exclude=uploads --exclude=private_uploads --exclude=.env --exclude=tmp --exclude=public --exclude=.htaccess --exclude=stderr.log --exclude=__pycache__ --exclude=tests --exclude=migrations backend/ $BACKEND_PATH/"
    # Numbered SQL migrations; the backend applies pending ones itself when it starts.
    - /bin/bash -c "mkdir -p $BACKEND_PATH/migrations && rsync -a --delete --include='[0-9][0-9][0-9]_*.sql' --exclude='*' database/mysql/ $BACKEND_PATH/migrations/"
    - /bin/bash -c "source $BACKEND_VENV/activate && pip install -r $BACKEND_PATH/requirements.txt"
    - /bin/bash -c "mkdir -p $BACKEND_PATH/tmp && touch $BACKEND_PATH/tmp/restart.txt"
